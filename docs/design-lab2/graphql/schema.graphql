type AuthPayload {
  accessToken: String!
  tokenType: String!
  expiresAt: String!
  user: AuthUser!
}

type AuthUser {
  id: ID!
  email: String!
  roles: [String!]!
}

type CalculationJob {
  id: ID!
  status: CalculationStatus!
  period: Date!
  productIds: [ID!]!
}

enum CalculationStatus {
  COMPLETED
  INVALIDATED
}

type CostBreakdown {
  calculationId: ID!
  productId: ID!
  period: Date!
  version: Int!
  materialCost: Decimal!
  laborCost: Decimal!
  overheadCost: Decimal!
  totalCost: Decimal!
  producedQty: Decimal!
  unitCost: Decimal!
  plannedUnitCost: Decimal
  unitCostDeviation: Decimal
}

input CostCalculationInput {
  period: Date!
  productIds: [ID!]!
  allocationBase: String!
}

input CredentialsInput {
  email: String!
  password: String!
}

type CurrentUser {
  id: ID!
  email: String!
  roles: [String!]!
}

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

"""Decimal (fixed-point)"""
scalar Decimal

enum ExportFormat {
  XLSX
  CSV
  PDF
}

input ExportReportInput {
  format: ExportFormat!
  reportId: ID = null
}

type ExternalMapping {
  id: ID!
  sourceSystem: String!
  entityType: String!
  externalCode: String!
  internalId: ID!
  status: String!
  updatedAt: DateTime!
}

type ImportError {
  recordKey: String
  errorCode: String!
  message: String!
}

type ImportRun {
  id: ID!
  source: ImportSource!
  period: Date!
  status: ImportStatus!
  recordsLoaded: Int!
  recordsFailed: Int!
  errors: [ImportError!]!
  startedAt: DateTime!
  finishedAt: DateTime
}

enum ImportSource {
  ERP
  MES
  FINANCE
}

enum ImportStatus {
  QUEUED
  RUNNING
  COMPLETED
  FAILED
}

type Mutation {
  register(input: CredentialsInput!): AuthUser!
  login(input: CredentialsInput!): AuthPayload!
  logout: Boolean!
  startProductionImport(input: StartImportInput!): ImportRun!
  startFinancialImport(input: StartImportInput!): ImportRun!
  retryImport(id: ID!): ImportRun!
  resolveExternalMapping(input: ResolveMappingInput!): ExternalMapping!
  calculateCost(input: CostCalculationInput!): [CostBreakdown!]!
  calculateProfitability(input: ProfitabilityCalculationInput!): CalculationJob!
  exportReport(input: ExportReportInput!): ReportExport!
}

type OverheadAllocation {
  calculationId: ID!
  productionOrderId: ID!
  costCenterId: ID!
  basisType: String!
  basisValue: Decimal!
  amount: Decimal!
}

type Product {
  id: ID!
  code: String!
  name: String!
  groupId: ID!
  unit: String!
  active: Boolean!
}

input ProductFilterInput {
  groupId: ID = null
  active: Boolean = null
  search: String = null
}

enum ProductSortField {
  CODE
  NAME
}

input ProductSortInput {
  field: ProductSortField! = CODE
  direction: SortDirection! = ASC
}

input ProfitabilityCalculationInput {
  period: Date!
  productIds: [ID!]!
}

input ProfitabilityFilterInput {
  periodFrom: Date!
  periodTo: Date!
  productIds: [ID!] = null
  groupIds: [ID!] = null
  minMarginPercent: Decimal = null
  costCenterIds: [ID!] = null
}

type ProfitabilityResult {
  id: ID!
  productId: ID!
  period: Date!
  revenue: Decimal!
  costOfSales: Decimal!
  profit: Decimal!
  marginPercent: Decimal!
  calculatedAt: DateTime!
}

enum ProfitabilitySortField {
  PERIOD
  REVENUE
  PROFIT
  MARGIN_PERCENT
}

input ProfitabilitySortInput {
  field: ProfitabilitySortField! = PERIOD
  direction: SortDirection! = ASC
}

type ProfitabilitySummary {
  count: Int!
  totalRevenue: Decimal!
  totalCost: Decimal!
  totalProfit: Decimal!
  averageMarginPercent: Decimal!
}

type Query {
  me: CurrentUser!
  products(filter: ProductFilterInput = null, sort: ProductSortInput = null): [Product!]!
  importRuns(source: ImportSource = null, period: Date = null): [ImportRun!]!
  costBreakdown(productId: ID!, period: Date!, version: Int = null): CostBreakdown
  overheadAllocations(productId: ID!, period: Date!, version: Int = null, costCenterId: ID = null): [OverheadAllocation!]!
  profitability(filter: ProfitabilityFilterInput!, sort: ProfitabilitySortInput = null): [ProfitabilityResult!]!
  profitabilitySummary(filter: ProfitabilityFilterInput!): ProfitabilitySummary!
  calculationStatus(id: ID!): CalculationJob
  reportExport(id: ID!): ReportExport
}

type ReportExport {
  id: ID!
  status: String!
  format: ExportFormat!
  fileRef: String
  errorMessage: String
}

input ResolveMappingInput {
  sourceSystem: String!
  entityType: String!
  externalCode: String!
  internalId: ID!
}

enum SortDirection {
  ASC
  DESC
}

input StartImportInput {
  source: ImportSource!
  period: Date!
}
